[package]
name = "voom"
version = "0.4.5"
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
description = "Fast, safe, parallel build-artifact pruning across every major language ecosystem"
edition = "2024"
rust-version = "1.88"
keywords = ["clean", "cleanup", "build-artifacts", "disk-space", "monorepo"]
categories = ["command-line-utilities", "development-tools", "filesystem"]
license = "MIT"
repository = "https://github.com/Goldziher/voom"
homepage = "https://github.com/Goldziher/voom"
documentation = "https://docs.rs/voom"
readme = "README.md"
# What ships in the `.crate`. Repository tooling (poly, cargo-deny, pre-commit) is meaningless
# outside the git checkout. `tests/` ships so the safety argument can be audited from the
# published source, and `clippy.toml`/`rustfmt.toml` ship with it — but the suite does not
# *run* from an unpacked `.crate`: cargo strips the path-only self dev-dependency that carries
# the `test-support` feature, and two integration tests `include_str!` hook manifests that are
# excluded below. `cargo publish` is unaffected; its verify step builds the lib and bin only.
# `assets/**` is excluded because crates.io rewrites a rendered README's relative image paths
# to point back at the repository — the banner still displays without the bytes in the tarball.
exclude = [
  ".ai-rulez/**",
  ".commitlintrc",
  ".github/**",
  ".gitignore",
  ".pre-commit-hooks.yaml",
  "adrs/**",
  "assets/**",
  "deny.toml",
  "npm-package/**",
  "pip-package/**",
  "poly-hooks.lock",
  "poly-hooks.toml",
  "poly.toml",
  "scripts/**",
]

# ~keep cargo-binstall metadata: fetch prebuilt archives from GitHub releases.
# ~keep archive-suffix resolves to .tar.gz on unix and .zip on windows, matching our release assets.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/voom-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"

[lib]
name = "voom"
path = "src/lib.rs"

[[bin]]
name = "voom"
path = "src/main.rs"

[features]
# Exposes `voom::testing` — the fixture-tree helpers — to the integration suites, which
# cannot see a `#[cfg(test)]` module of the library they link against. Off for a normal
# build; the self dev-dependency below turns it on for `cargo test`. It pulls `tempfile`
# in as a real dependency because the integration suites link the lib as a *non-test*
# target, where dev-dependencies are not in scope.
test-support = ["dep:tempfile"]

[dependencies]
anstream = "1.0"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "color", "wrap_help"] }
dirs = "6.0"
globset = "0.4"
humansize = "2.1"
ignore = "0.4.33"
indicatif = "0.18"
notify = "8.2"
notify-debouncer-full = "0.7"
owo-colors = "4"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = { version = "3.27", optional = true }
thiserror = "2.0"
toml = "1.1"

# `chflags(2)` has no std route: `std::os::darwin::fs::MetadataExt::st_flags` reads the BSD
# flags and nothing in std sets them, and `--force` has to clear UF_IMMUTABLE before it can
# unlink. Target-gated so no other platform grows a dependency for it; libc is already compiled
# on every build via dirs-sys, notify and mio, so this adds a manifest line, not a crate.
[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2.2"
insta = { version = "1.48", features = ["json"] }
predicates = "3.1"
pretty_assertions = "1.4"
# The crate depending on itself is how an integration test reaches a feature-gated helper:
# the test binary links the same lib unit, built with `test-support` on.
voom = { path = ".", features = ["test-support"] }

# The bar is `cargo clippy --all-targets -- -D warnings`, which picks this table up. Pedantic
# is on deliberately: this is a tool that deletes directories, so the marginal lint is worth
# more here than the marginal convenience. Narrow `#[allow]`/`#[expect]` with a reason is the
# escape hatch — never a crate-wide one. `unwrap`/`expect` are denied outside tests because a
# panic mid-run leaves a partially deleted tree and no report; clippy.toml exempts tests.
[lints.clippy]
expect_used = "warn"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"

# A speed-marketed binary ships optimized. Costs release build time, which is paid
# once per release in CI rather than by anyone running the tool.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
