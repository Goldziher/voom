[package]
include = [
  "/Cargo.toml",
  "/Cargo.lock",
  "/src/**",
  "!/src/report/human/snapshots/**",
  "!/src/report/snapshots/**",
  "/README.md",
  "/LICENSE",
  "!/src/worktrees/tests.rs",
  "!/src/bazel/tests.rs",
]
name = "voom"
version = "0.13.0"
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
description = "Fast, safe, parallel build-artifact pruning across every major language ecosystem"
edition = "2024"
rust-version = "1.88"
keywords = ["clean", "cleanup", "build-artifacts", "disk-space", "monorepo"]
categories = ["command-line-utilities", "development-tools", "filesystem"]
license = "MIT"
repository = "https://github.com/Goldziher/voom"
homepage = "https://github.com/Goldziher/voom"
documentation = "https://docs.rs/voom"
readme = "README.md"

# ~keep cargo-binstall metadata: fetch prebuilt archives from GitHub releases.
# ~keep archive-suffix resolves to .tar.gz on unix and .zip on windows, matching our release assets.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/voom-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"

[lib]
name = "voom"
path = "src/lib.rs"

[[bin]]
name = "voom"
path = "src/main.rs"

[features]
# Exposes `voom::testing` — the fixture-tree helpers — to the integration suites, which
# cannot see a `#[cfg(test)]` module of the library they link against. Off for a normal
# build; the self dev-dependency below turns it on for `cargo test`. It pulls `tempfile`
# in as a real dependency because the integration suites link the lib as a *non-test*
# target, where dev-dependencies are not in scope.
test-support = ["dep:tempfile"]

[dependencies]
anstream = "1.0"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "color", "wrap_help"] }
dirs = "7.0"
globset = "0.4"
humansize = "2.1"
ignore = "0.4.33"
indicatif = "0.18"
notify = "8.2"
notify-debouncer-full = "0.7"
owo-colors = "4"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = { version = "3.27", optional = true }
thiserror = "2.0"
toml = "1.1"

# The descriptor-relative walk in `src/tree` (`openat`, `fstatat`, `unlinkat`, and on Apple
# platforms `getattrlistbulk(2)` and `fchflags(2)`) has no std route: std's `read_dir` resolves
# every directory from its full path and stats every entry separately. Unix-only; libc is
# already compiled on every build via dirs-sys, notify and mio, so this adds a manifest line,
# not a crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2.2"
insta = { version = "1.49", features = ["json"] }
predicates = "3.1"
pretty_assertions = "1.4"
# The crate depending on itself is how an integration test reaches a feature-gated helper:
# the test binary links the same lib unit, built with `test-support` on.
voom = { path = ".", features = ["test-support"] }

# The bar is `cargo clippy --all-targets -- -D warnings`, which picks this table up. Pedantic
# is on deliberately: this is a tool that deletes directories, so the marginal lint is worth
# more here than the marginal convenience. Narrow `#[allow]`/`#[expect]` with a reason is the
# escape hatch — never a crate-wide one. `unwrap`/`expect` are denied outside tests because a
# panic mid-run leaves a partially deleted tree and no report; clippy.toml exempts tests.
[lints.clippy]
expect_used = "warn"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"

# A speed-marketed binary ships optimized. Costs release build time, which is paid
# once per release in CI rather than by anyone running the tool.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
