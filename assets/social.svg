<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="voom">
  <title>voom</title>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.26" />
      <stop offset="48%" stop-color="#0d9488" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="blush" cx="88%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0" />
      <stop offset="12%" stop-color="#2dd4bf" />
      <stop offset="52%" stop-color="#fbbf24" />
      <stop offset="86%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="fadeTeal" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="1160" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.1" />
      <stop offset="40%" stop-color="#2dd4bf" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="fadeAmber" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="1110" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.08" />
      <stop offset="45%" stop-color="#fbbf24" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="22%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="68%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <!-- The pink pixels are the snow the Voom is clearing. The mask, not the pattern, carries
     the direction of travel: dense ahead of the wordmark, swept to nothing behind it. -->
    <pattern id="snow" width="44" height="44" patternUnits="userSpaceOnUse">
      <g fill="#f472b6">
        <rect x="4" y="7" width="9" height="9" opacity="0.5" />
        <rect x="29" y="19" width="6" height="6" opacity="0.62" />
        <rect x="17" y="33" width="4" height="4" opacity="0.42" />
        <rect x="36" y="2" width="4" height="4" opacity="0.3" />
        <rect x="21" y="12" width="3" height="3" opacity="0.28" />
        <rect x="7" y="27" width="5" height="5" opacity="0.36" />
      </g>
    </pattern>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#ffffff" opacity="0.08" />
      <rect x="4" y="5" width="1" height="1" fill="#2dd4bf" opacity="0.12" />
      <rect x="6" y="2" width="1" height="1" fill="#fbbf24" opacity="0.08" />
    </pattern>
    <mask id="drift"><rect width="1280" height="640" fill="url(#sweep)" /></mask>
    <g id="wm" shape-rendering="crispEdges">
      <rect x="190" y="235" width="34" height="34" />
      <rect x="207" y="269" width="34" height="34" />
      <rect x="224" y="303" width="34" height="34" />
      <rect x="241" y="337" width="34" height="34" />
      <rect x="326" y="235" width="34" height="34" />
      <rect x="309" y="269" width="34" height="34" />
      <rect x="292" y="303" width="34" height="34" />
      <rect x="275" y="337" width="34" height="34" />
      <rect x="258" y="371" width="34" height="34" />
      <rect x="445" y="235" width="102" height="34" />
      <rect x="411" y="269" width="34" height="102" />
      <rect x="547" y="269" width="34" height="102" />
      <rect x="445" y="371" width="102" height="34" />
      <rect x="666" y="235" width="102" height="34" />
      <rect x="632" y="269" width="34" height="102" />
      <rect x="768" y="269" width="34" height="102" />
      <rect x="666" y="371" width="102" height="34" />
      <rect x="853" y="235" width="238" height="34" />
      <rect x="853" y="269" width="34" height="136" />
      <rect x="955" y="269" width="34" height="136" />
      <rect x="1057" y="269" width="34" height="136" />
    </g>
    <clipPath id="frame"><rect width="1280" height="640" rx="18" /></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="640" fill="#070f0e" />
    <path d="M60 84L392 66L120 448L0 500L0 160Z" fill="url(#beam)" opacity="0.6" />
    <rect width="1280" height="640" fill="url(#blush)" />
    <rect width="1280" height="640" fill="url(#snow)" mask="url(#drift)" />
    <path d="M44 44H1236V596H44Z" fill="none" stroke="#2dd4bf" stroke-width="2.5" />
    <path d="M62 62H1218V578H62Z" fill="none" stroke="#5eead4" stroke-width="0.9" opacity="0.3" />
    <!-- A solid bar breaking into loose pixels: the swept edge, abstracted. -->
    <g fill="url(#fadeTeal)" shape-rendering="crispEdges">
      <rect x="120" y="138" width="420" height="20" />
      <rect x="556" y="138" width="58" height="20" />
      <rect x="633" y="138" width="46" height="20" />
      <rect x="700" y="138" width="37" height="20" />
      <rect x="763" y="138" width="30" height="20" />
      <rect x="821" y="138" width="24" height="20" />
      <rect x="879" y="138" width="19" height="20" />
      <rect x="937" y="138" width="15" height="20" />
      <rect x="997" y="138" width="12" height="20" />
      <rect x="1062" y="138" width="10" height="20" />
      <rect x="1132" y="138" width="8" height="20" />
    </g>
    <g fill="url(#fadeAmber)" shape-rendering="crispEdges">
      <rect x="120" y="476" width="300" height="14" />
      <rect x="436" y="476" width="58" height="14" />
      <rect x="513" y="476" width="46" height="14" />
      <rect x="580" y="476" width="37" height="14" />
      <rect x="643" y="476" width="30" height="14" />
      <rect x="701" y="476" width="24" height="14" />
      <rect x="759" y="476" width="19" height="14" />
      <rect x="817" y="476" width="15" height="14" />
      <rect x="877" y="476" width="12" height="14" />
      <rect x="942" y="476" width="10" height="14" />
      <rect x="1012" y="476" width="8" height="14" />
      <rect x="1091" y="476" width="6" height="14" />
    </g>
    <g transform="translate(640 320) skewX(-9) translate(-640 -320)">
      <use href="#wm" x="13" y="14" fill="#f472b6" />
      <use href="#wm" x="-5" y="-6" fill="#fbbf24" />
      <use href="#wm" fill="#2dd4bf" />
    </g>
    <rect x="44" y="589" width="1192" height="7" fill="url(#rule)" />
    <rect width="1280" height="640" fill="url(#grain)" opacity="0.38" />
  </g>
</svg>
