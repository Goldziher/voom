[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voom-cli"
version = "0.1.0"
description = "Fast, safe, parallel build-artifact pruning across 20+ language ecosystems"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Na'aman Hirschfeld", email = "nhirschfeld@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Utilities",
  "Topic :: System :: Filesystems",
  "Environment :: Console",
]
keywords = ["cleanup", "build", "artifacts", "disk-space", "cli", "prune", "rust"]
requires-python = ">=3.10"
dependencies = ["certifi>=2024.7.4"]

[project.urls]
Homepage = "https://github.com/Goldziher/voom"
Repository = "https://github.com/Goldziher/voom.git"
Issues = "https://github.com/Goldziher/voom/issues"

[project.scripts]
voom = "voom.cli:main"

[tool.setuptools]
packages = ["voom"]
