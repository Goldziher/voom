name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The shared org gate (poly fmt --check + poly lint over the whole repo), same as
  # basemind and uncomment run. `setup-rust` is required because poly.toml enables the
  # cargo/clippy hook. It needs no permissions beyond the workflow-level `contents: read`.
  validate:
    uses: xberg-io/actions/.github/workflows/reusable-validate.yml@v1
    with:
      setup-rust: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast stays off so a red Windows leg does not cancel Linux and macOS.
      fail-fast: false
      matrix:
        # DO NOT REMOVE windows-latest, and do not make it non-blocking. It is expected
        # to fail today, and that is the reason it is here: the protected-path denylist
        # cannot fire because Windows `canonicalize()` returns verbatim `\\?\C:\...`
        # paths, `--one-file-system` is unenforced, and the snapshots assert `/`-separated
        # paths. Those failures are the specification for the Windows fix work — the leg
        # goes green when the defects are fixed, not when the leg is deleted or masked.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all-targets

  # Cargo.toml advertises a `rust-version`; published crates are resolved against it, so
  # it has to be true. The version is read out of the manifest rather than written here —
  # a hardcoded number is one more surface to bump, and this repo already has five.
  # Library and binary only, deliberately not `--all-targets`: dev-dependencies are not
  # bound by the crate's MSRV, and compiling them here would fail the job for a version
  # constraint that no consumer of the published crate is ever subject to.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve MSRV from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          version="$(grep -E '^rust-version = "' Cargo.toml | head -1 | cut -d'"' -f2)"
          [[ -n "$version" ]] || { echo "::error::Cargo.toml declares no rust-version"; exit 1; }
          echo "MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the MSRV toolchain
        run: rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
      - name: Check against the MSRV
        run: cargo "+${{ steps.msrv.outputs.version }}" check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh

  # The release workflow gates on these five agreeing. Catching drift on the PR that
  # introduces it is cheaper than catching it at tag time. See adrs/0010.
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare version surfaces
        run: |
          set -euo pipefail
          cargo_v="$(grep -E '^version = "' Cargo.toml | head -1 | cut -d'"' -f2)"
          npm_v="$(jq -r '.version' npm-package/package.json)"
          pypi_v="$(grep -E '^version = "' pip-package/pyproject.toml | head -1 | cut -d'"' -f2)"
          init_v="$(grep -E '^__version__ = "' pip-package/voom/__init__.py | cut -d'"' -f2)"
          echo "Cargo=$cargo_v npm=$npm_v pypi=$pypi_v __init__=$init_v"
          fail=0
          [[ "$npm_v"  == "$cargo_v" ]] || { echo "::error::npm-package/package.json=$npm_v != $cargo_v"; fail=1; }
          [[ "$init_v" == "$pypi_v"  ]] || { echo "::error::__init__.py=$init_v != pyproject=$pypi_v"; fail=1; }
          stale="$(grep -oE '(@goldziher/voom@|voom-cli==)[0-9][^ "]*' poly-hooks.toml \
                   | sed -E 's/.*(@|==)//' | sort -u | grep -v "^${cargo_v}$" || true)"
          [[ -z "$stale" ]] || { echo "::error::poly-hooks.toml pins stale version(s): $stale"; fail=1; }
          exit $fail
