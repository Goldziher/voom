name: AI-Rulez validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Goldziher/poly@v0
        with:
          version: "0.29.0"
      - uses: xberg-io/actions/setup-ai-rulez@v1
        with:
          ai-rulez-version: "5.6.3"
          source-revision: "d4a0cbe4712319312104ba3f2a618ef55645ef9f"
      - uses: xberg-io/actions/validate-ai-rulez@v1
        with:
          expected-config-count: "1"
